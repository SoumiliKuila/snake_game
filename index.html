<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake Game</h1>

    <div class="score-board">
        Score: <span id="score">0</span>
        |
        Best: <span id="best">0</span>
    </div>

    <canvas id="gameCanvas" width="360" height="360"></canvas>

    <p id="message">
        Press Start to Play
    </p>

    <button id="startBtn" onclick="startGame()">
        Start Game
    </button>

    <div class="controls">

        <button onclick="changeDirection('up')">⬆️</button>

        <div>
            <button onclick="changeDirection('left')">⬅️</button>

            <button onclick="changeDirection('down')">⬇️</button>

            <button onclick="changeDirection('right')">➡️</button>
        </div>

    </div>

    <p class="keyboard">
        You can also use Arrow Keys / WASD
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
